<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Autos</title>
<style>
:root { --bg:#edf3ef; --surface:#fff; --ink:#0f1c16; --muted:#55685e; --line:#d4e0d8; --sign:#0b7a43; --on-sign:#fff; --drop:#1456b8; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#08120d; --surface:#101c16; --ink:#e5efe9; --muted:#92a89c; --line:#233a2f; --sign:#3fbf7f; --on-sign:#04110a; --drop:#6ea2f2; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 21px; margin: 0; }
.muted { color: var(--muted); font-size: 14px; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 6px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.name { font-weight: 700; }
.price { font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.drop { color: var(--drop); font-size: 13px; font-weight: 600; }
.meta { color: var(--muted); font-size: 14.5px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.btn { display: block; text-align: center; text-decoration: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 11px; padding: 11px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--on-sign); }
</style>
</head>
<body>
<main>
  <h1 id="head">Autos</h1>
  <p class="muted" id="sub">Öffne diese Seite über eine Sammel-Meldung des Auto-Wächters.</p>
  <div id="list" style="display:grid;gap:12px"></div>
</main>
<script>
(function () {
  function dec(h) {
    h = h.replace(/-/g, '+').replace(/_/g, '/');
    while (h.length % 4) h += '=';
    var bin = atob(h), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function enc(o) {
    var bytes = new TextEncoder().encode(JSON.stringify(o)), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  var d = null;
  try { d = dec(location.hash.slice(1)); } catch (e) { d = null; }
  if (!d || !d.i) return;

  document.getElementById('head').textContent = d.t || 'Autos';
  document.title = d.t || 'Autos';
  document.getElementById('sub').textContent = d.i.length + (d.i.length === 1 ? ' Auto' : ' Autos') + '. Tippe auf „Inserat öffnen“, um es anzusehen.';
  var list = document.getElementById('list');
  d.i.forEach(function (l) {
    var c = el('div', 'card');
    var top = el('div', 'top');
    top.appendChild(el('span', 'name', l.n));
    top.appendChild(el('span', 'price', l.p));
    c.appendChild(top);
    if (l.d) c.appendChild(el('span', 'drop', 'Preis gesenkt'));
    c.appendChild(el('div', 'meta', l.f));
    c.appendChild(el('div', 'meta', l.q));
    var row = el('div', 'row');
    var open = el('a', 'btn primary', 'Inserat öffnen');
    open.href = l.u; open.target = '_blank'; open.rel = 'noopener';
    row.appendChild(open);
    var req = el('a', 'btn', 'Anfragetext');
    req.href = 'anfrage.html#' + enc({ n: l.n, j: l.j, k: l.k, q: l.q, u: l.u, h: l.h, m: l.m });
    row.appendChild(req);
    c.appendChild(row);
    list.appendChild(c);
  });
})();
</script>
</body>
</html>
